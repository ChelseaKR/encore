# Release pipeline (M4 scope, docs/adr/0008-secrets-at-rest-scheme.md's sibling
# ADR on release integrity — full signing/SBOM/provenance chain).
#
# A maintainer runs the reviewed workflow from main with an existing signed
# vX.Y.Z tag. It re-runs the literal `make verify` at the tagged commit
# (REL-14, P0-4) before building — lint, type, test/coverage, AND security
# (Semgrep + pip-audit + osv-scanner + gitleaks), the exact same target a contributor runs locally, so a
# release can never ship a commit that didn't pass its own gate. (Earlier version
# of this job re-implemented ruff/mypy/pytest by hand and silently dropped the
# security stage entirely — fixed here by calling `make verify` instead of
# reinventing it.)
#
# The container half used to build `ghcr.io/chelseakr/encore:${TAG}`, scan it,
# and then end — no `docker login`, no `docker push`, no `packages: write`.
# The image was built on the runner and discarded, so M4's "v0.1.0 published to
# GHCR" exit criterion was not reachable by running this workflow: it would go
# green and publish nothing. Issue #50. The push now happens after the Trivy
# gate, on the same local tag, so the published image is the scanned one.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-at-tag:
    name: re-verify at tagged commit (make verify)
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.tag.outputs.commit }}
      release_tag: ${{ steps.tag.outputs.tag }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and verify the reviewed signed tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          RELEASE_COMMIT="$(git rev-parse --verify "${TAG}^{commit}")"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/.github/allowed_signers"
          git verify-tag -- "${TAG}"
          {
            echo "tag=${TAG}"
            echo "commit=${RELEASE_COMMIT}"
            echo "tag_object_sha=$(git rev-parse "refs/tags/${TAG}")"
          } >> "${GITHUB_OUTPUT}"
          git checkout --detach "${RELEASE_COMMIT}"
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          python-version: "3.12"
          # setup-uv enables its cache by default; explicitly turned off here
          # (unlike ci.yml): this workflow publishes release artifacts, and a cross-run
          # uv/pip cache is exactly the cache-poisoning surface zizmor flags on
          # release pipelines — a poisoned cache entry could ride into a signed,
          # published artifact. ci.yml runs on mutable branches/PRs where that
          # risk is materially lower and the speed win is worth it.
          enable-cache: false
      - name: Install gitleaks (pinned, matches .pre-commit-config.yaml)
        run: |
          GL=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
      - name: Install osv-scanner (pinned, matches ci.yml — second dependency-scan engine)
        run: |
          OSV=2.4.0
          curl -sSfL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: Install trivy (pinned, matches ci.yml and the Makefile)
        # `make verify` now composes `container-verify` (docker build + Trivy CVE
        # scan + /livez bring-up), so the re-verify job needs the same scanner CI
        # and a contributor use. Keep this version in step with ci.yml.
        run: |
          TRIVY=0.74.0
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY}/trivy_${TRIVY}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          chmod +x /usr/local/bin/trivy
      - name: CHANGELOG carries a section for this tag (REL-10)
        # A release must not tag a commit whose CHANGELOG has no matching
        # `## [X.Y.Z]` section. The verified tag is routed through the
        # environment rather than interpolated into the shell.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${VERSION}" = "${PACKAGE_VERSION}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${VERSION}]' section for tag ${TAG}" >&2
            exit 1
          }
      - name: make install
        run: make install
      - name: make verify — lint + type + cov + security + todo-gate + slo/citation/external-refs checks + wheel + container
        run: make verify

  build-sign-publish:
    name: build · scan · publish · package
    runs-on: ubuntu-latest
    needs: [verify-at-tag]
    permissions:
      contents: read
      id-token: write
      attestations: write
      # Needed to push the release image to GHCR. Scoped to this job only —
      # `verify-at-tag` and `publish-release` stay read-only, so the token that
      # can write packages exists solely for the build-scan-push step.
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.verify-at-tag.outputs.release_commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build wheel and source distribution
        run: uv build
      - name: Generate CycloneDX SBOM
        run: |
          uv sync --locked --no-dev
          uvx --from cyclonedx-bom==7.3.0 cyclonedx-py environment .venv \
            --sv 1.7 --of JSON --pyproject pyproject.toml \
            --output-reproducible --validate -o dist/encore.cdx.json
      - name: Record distribution digests
        run: (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"
      - name: Build image
        env:
          TAG: ${{ needs.verify-at-tag.outputs.release_tag }}
        run: docker build -t "ghcr.io/chelseakr/encore:${TAG}" .
      - name: Container CVE scan (Trivy, SEC-28) — gate the release, not just CI
        # Scans the *published* tag, which `make container-scan` (run against
        # `encore:verify` in verify-at-tag) does not build. Flags are deliberately
        # identical to the Makefile target's — if you change one, change both.
        env:
          IMAGE: "ghcr.io/chelseakr/encore:${{ needs.verify-at-tag.outputs.release_tag }}"
        shell: bash
        run: |
          set -euo pipefail
          TRIVY=0.74.0
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY}/trivy_${TRIVY}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          chmod +x /usr/local/bin/trivy
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --scanners vuln --skip-version-check "${IMAGE}"
          # Record which local image this gate actually passed, so the push step
          # can prove it publishes that one. Captured after the scan on purpose:
          # a value read before it would attest to an image the gate had not yet
          # examined. Assigned first, then echoed — `echo "$(cmd)"` would throw
          # away the command's exit status and write an empty id on failure.
          SCANNED_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}")"
          echo "SCANNED_IMAGE_ID=${SCANNED_IMAGE_ID}" >> "${GITHUB_ENV}"
      - name: Push the scanned image to GHCR (M4 exit criterion, issue #50)
        # Ordered deliberately after the Trivy gate: the image that is pushed is
        # the one that was scanned, not a rebuild of it. The `SCANNED_IMAGE_ID`
        # comparison below is what makes that a fact rather than an arrangement.
        # It spans the step boundary — the id was recorded by the scan step — so
        # any step inserted between the two that rebuilds or re-tags the image
        # fails the release before anything is published.
        #
        # An earlier draft of this step captured the id here, immediately before
        # `docker push`, and compared it immediately after. `docker push` cannot
        # change a local image id, so that comparison could not fail: it read as
        # a provenance check and asserted nothing. Measured against a throwaway
        # registry before this was rewritten.
        env:
          IMAGE: "ghcr.io/chelseakr/encore:${{ needs.verify-at-tag.outputs.release_tag }}"
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SCANNED_IMAGE_ID:-}" || {
            echo "::error::the CVE scan step recorded no image id; refusing to publish" >&2
            exit 1
          }
          PUSH_CANDIDATE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}")"
          test "${PUSH_CANDIDATE_ID}" = "${SCANNED_IMAGE_ID}" || {
            echo "::error::${IMAGE} now resolves to ${PUSH_CANDIDATE_ID}, but the CVE gate" \
                 "passed ${SCANNED_IMAGE_ID}. Refusing to publish an unscanned image." >&2
            exit 1
          }
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}"
          docker logout ghcr.io
          # `docker push` populates RepoDigests with the digest the registry
          # assigned; it is empty before the first push. Check the length before
          # indexing, so an absent digest is a named failure rather than a Go
          # template error — and so no release can cite a digest that is not one.
          DIGEST_COUNT="$(docker image inspect --format '{{len .RepoDigests}}' "${IMAGE}")"
          test "${DIGEST_COUNT}" -ge 1 || {
            echo "::error::pushed ${IMAGE} but the daemon recorded no repo digest for it" >&2
            exit 1
          }
          PUSHED_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")"
          {
            echo "### Published container"
            echo
            echo '```'
            echo "image:  ${IMAGE}"
            echo "digest: ${PUSHED_DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: recheck tag · publish without checkout
    needs: [verify-at-tag, build-sign-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Recheck immutable tag object and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-at-tag.outputs.release_tag }}
          TAG_OBJECT_SHA: ${{ needs.verify-at-tag.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
          gh release create "${TAG}" dist/* \
            --title "encore ${TAG}" --generate-notes
