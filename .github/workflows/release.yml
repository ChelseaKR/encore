# Release pipeline (M4 scope, docs/adr/0008-secrets-at-rest-scheme.md's sibling
# ADR on release integrity — full signing/SBOM/provenance chain).
#
# Stubbed at M0: wired and shaped correctly, but only fires on a signed vX.Y.Z tag,
# which does not exist yet. Re-runs `make verify` at the tagged commit (REL-14) before
# building, so a release can never ship a commit that didn't pass its own gate.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-at-tag:
    name: re-verify at tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff format --check src tests && ruff check src tests
      - run: mypy
      - run: pytest --cov --cov-fail-under=85

  build-sign-publish:
    name: build · SBOM · sign · publish (GHCR)
    runs-on: ubuntu-latest
    needs: [verify-at-tag]
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign (SEC-29)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Build image
        run: docker build -t "ghcr.io/chelseakr/encore:${GITHUB_REF_NAME}" .
      # TODO (pre-v0.1.0, M4): log in to GHCR, push by digest (never :latest — REL-18),
      # generate a CycloneDX SBOM (SEC-27), Trivy-scan CRITICAL,HIGH (SEC-28), keyless
      # cosign-sign + attach SLSA provenance (SEC-29), attach SBOM+provenance+CHANGELOG
      # to the GitHub release (REL-20). Left unimplemented until there is an actual
      # release to ship — a stub that always passed would be a false-green gate.
