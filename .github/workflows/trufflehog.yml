# Scheduled full-history verified-secret scan (SEC-19). gitleaks already covers
# Gates 1-2 (pre-commit + CI diff, see .pre-commit-config.yaml and ci.yml's
# "security" job); this is Gate 3 — a periodic sweep of the *entire* commit
# history with a different engine and its own detector set, catching anything a
# diff-scoped scan by construction cannot (a secret introduced and later removed
# in the same PR still shows up in history).
name: trufflehog

on:
  schedule:
    - cron: "0 8 * * 0"  # weekly, Sunday, staggered off ci.yml/codeql.yml's crons
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trufflehog-scheduled
  cancel-in-progress: true

jobs:
  scan:
    name: full-history secret scan (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # full clone — this is a whole-history scan, not a diff
          persist-credentials: false
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f  # v3.95.8
        with:
          path: ./
          # Pinned. The action's `version` input defaults to "latest" and it runs
          # `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so SHA-pinning the action
          # above does not pin what actually scans. That is how this gate changed
          # behaviour with no commit here: upstream published 3.96.0 and the next
          # run picked it up.
          version: "3.96.0"
          # `--fail` is not passed. The action's own command already includes it
          # and repeating a flag is a hard CLI error, so this scan exited 1 at
          # startup having read nothing: no chunk count, no findings, no coverage.
          # Lob is excluded because 3.96.0's Lob detector pattern,
          # `\b((live|test)_[a-zA-Z0-9_]{35})\b`, matches any identifier starting
          # `test_` with exactly 35 word characters after it, which is an ordinary
          # pytest function name. Its verifier then POSTs to api.lob.com and reads the
          # 403 as proof of a live key with no billing attached, so matches are
          # promoted to verified. The first scan that actually ran here reported 9,
          # every one a test name. There is no Lob integration in this repo. Same
          # reasoning as gtfs-scorecard ADR 0044.
          extra_args: --only-verified --exclude-detectors=Lob
