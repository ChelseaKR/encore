# Scheduled full-history secret scan (SEC-19). gitleaks already covers
# Gates 1-2 (pre-commit + CI diff, see .pre-commit-config.yaml and ci.yml's
# "security" job); this is Gate 3 — a periodic sweep of the *entire* commit
# history with a different engine and its own detector set, catching anything a
# diff-scoped scan by construction cannot (a secret introduced and later removed
# in the same PR still shows up in history).
name: trufflehog

on:
  schedule:
    - cron: "0 8 * * 0"  # weekly, Sunday, staggered off ci.yml/codeql.yml's crons
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trufflehog-scheduled
  cancel-in-progress: true

jobs:
  scan:
    name: full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # full clone — this is a whole-history scan, not a diff
          persist-credentials: false
      - name: TruffleHog (full history, all reported tiers)
        env:
          # Pinned by tag AND digest. This runs the same image and the same
          # `git file:///tmp/` command that trufflesecurity/trufflehog@v3.95.8
          # ran, but without that action. The action always passes `--fail` and
          # `--github-actions`, so its verdict is "any finding at all". This step
          # needs the findings as JSON, so that the gate below can grade them
          # against exact fingerprints (2026-09-18, see
          # .github/trufflehog-allowlist.toml).
          #
          # The pin still matters. The action's `version` input defaulted to
          # "latest", so SHA-pinning the action did not pin what scanned, and this
          # gate once changed behaviour with no commit here: upstream published
          # 3.96.0 and the next run picked it up. Neither Renovate nor Dependabot
          # can see this line, so bump it by hand, tag and digest together. The
          # digest is the multi-arch index that 3.95.8 resolved to on the runner
          # (and on ghcr.io) as of 2026-09-18.
          IMAGE: ghcr.io/trufflesecurity/trufflehog:3.95.8@sha256:d52e62fe0237bf0199cb79f94593051300b0989d9aeab8b431001d9f75e469c1
          # Lob is excluded because its detector pattern,
          # `\b((live|test)_[a-zA-Z0-9_]{35})\b`, matches any identifier starting
          # `test_` with exactly 35 word characters after it, which is an ordinary
          # pytest function name. Its verifier then POSTs to api.lob.com and reads the
          # 403 as proof of a live key with no billing attached, so matches are
          # promoted to verified. The first scan that actually ran here reported 9,
          # every one a test name. There is no Lob integration in this repo. Same
          # reasoning as gtfs-scorecard ADR 0044. (Still true at 3.95.8 and 3.97.1;
          # the pattern is not version-specific.)
          #
          # --results=verified,unknown,unverified, not `--only-verified`. TruffleHog
          # sorts a candidate three ways: `verified` (it authenticated against the
          # live service), `unverified` (it asked, and the service said no) and
          # `unknown` (it could not ask). A credential that was committed and later
          # REVOKED comes back `unverified` -- the revocation is what makes the
          # provider say no -- and a cleaned-up leak is the whole reason a scheduled
          # full-history scan exists. `--only-verified` therefore could not fail on
          # the case this gate was built for. Measured 2026-09-06 on a throwaway
          # clone with a real-shaped (not vendor-example) AWS key planted in one
          # commit and deleted in the next, confirmed present in history and absent
          # at HEAD:
          #
          #   --only-verified                        exit 0,   0 reported
          #   --results=verified,unknown             exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # When a finding is a placeholder, do NOT exclude its detector and do
          # NOT narrow the tier. Add its exact fingerprint to
          # .github/trufflehog-allowlist.toml; the failing run prints it. Exclude a
          # detector by name only when the detector itself is broken, as Lob's is.
          # A detector exclusion stops the search for that credential type in
          # every file and every commit.
          ARGS: --results=verified,unknown,unverified --exclude-detectors=Lob
        # No `${{ }}` in this script: everything it needs is in env above.
        run: |
          status=0
          # $ARGS is deliberately unquoted: it is two flags.
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD:/tmp" -w /tmp "$IMAGE" \
            git file:///tmp/ --fail --no-update --json $ARGS \
            > "$RUNNER_TEMP/trufflehog-findings.jsonl" \
            2> "$RUNNER_TEMP/trufflehog-scan.log" || status=$?
          cat "$RUNNER_TEMP/trufflehog-scan.log"
          # The gate fails on any finding not listed in the allowlist. It also
          # fails if the scan errored, read zero chunks, or reported a verdict
          # that does not match its own output. See scripts/trufflehog_gate.py.
          python3 scripts/trufflehog_gate.py \
            --findings "$RUNNER_TEMP/trufflehog-findings.jsonl" \
            --log "$RUNNER_TEMP/trufflehog-scan.log" \
            --exit-code "$status" \
            --allowlist .github/trufflehog-allowlist.toml
