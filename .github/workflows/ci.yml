name: ci

# Agility: every push and PR runs the full merge gate. Reproducibility: the gate is
# the same `make` targets a contributor runs locally, on a pinned toolchain.
#
# Stage numbering follows STANDARDS/CI-CD-STANDARD.md §1 (the canonical pipeline):
#   1 format · 2 lint · 3 type · 4 test · 5 security · 6 a11y · 7 perf · 8 responsible · 9 build
# At M0 (empty src-layout scaffold, no feature code) stages 6/7/8 are N/A-with-reason —
# recorded in docs/ROADMAP.md's metrics ledger, not silently skipped. They go live at the
# milestone that introduces the surface they gate: 6 (a11y) at M2 (first real UI), 8
# (responsible: read-only-Plex + no-secrets-in-logs + no-outing guards) at M1 (Plex sync
# lands). Stage 9 here is build-only validation; the signing/SBOM/provenance release path
# is a separate workflow that runs on tags (M4 scope, docs/adr/0008).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege (securability): grant read-only by default; jobs widen only what
# they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: format · lint · type · test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Compatibility: the full supported interpreter range runs on pushes to main
        # and on manual dispatch; pull requests exercise only the canonical version to
        # save Actions minutes, since the merge to main re-runs the full matrix.
        python: ${{ (github.event_name == 'pull_request') && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Stage 1 — format
        run: ruff format --check src tests
      - name: Stage 2 — lint
        run: ruff check src tests
      - name: Stage 3 — type (mypy strict)
        run: mypy
      - name: Stage 4 — test with coverage (branch >=85%)
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Stage 5 — security (pip-audit · gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Vulnerable dependency scan (pip-audit)
        run: pip-audit -r <(pip freeze)
      - name: Secret scan (gitleaks)
        # Run the pinned gitleaks binary directly rather than gitleaks-action: the
        # action crashes on pull_request events before it scans (see ledger's ci.yml,
        # the same fix is reused here). Deterministic and honours .gitleaks.toml.
        run: |
          GL=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1

  build:
    name: Stage 9 — build (container, validation only)
    runs-on: ubuntu-latest
    needs: [gate, security]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Build image (not pushed — proves the Dockerfile builds)
        run: docker build -t encore:ci .
