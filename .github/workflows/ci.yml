name: ci

# Agility: every push and PR runs the full merge gate. Reproducibility: the gate is
# the same `make` targets a contributor runs locally, on a pinned toolchain — CI
# calls `make install`/`make lint`/`make type`/`make cov`/`make security`, the exact
# targets `make verify` composes, so there is no second, drifted reimplementation
# of the gate (CQ-09, CICD-27). `release.yml`'s `verify-at-tag` runs the literal
# `make verify` in one non-matrixed job; here the same targets are split across two
# jobs so gitleaks can get full git history (`fetch-depth: 0`) without paying that
# clone cost on every matrix leg.
#
# Stage numbering follows STANDARDS/CI-CD-STANDARD.md §1 (the canonical pipeline):
#   1 format · 2 lint · 3 type · 4 test · 5 security · 6 a11y · 7 perf · 8 responsible · 9 build
# Stages 6/7 are N/A-with-reason (no UI, no hot path yet) — recorded in
# docs/ROADMAP.md's metrics ledger, not silently skipped; 6 (a11y) goes live at M2
# (first real UI). Stage 8 (responsible: read-only-Plex + no-secrets-in-logs +
# no-outing guards) went live with F1 (Plex sync, M1): `make responsible` runs the
# marker-selected guard tests as an explicit blocking step — the no-outing battery
# grows with the F4/F5 egress surfaces (M2).
# Stage 9 here builds AND scans the image (SEC-28) and proves it boots; the
# signing/SBOM/provenance release path is a separate workflow that runs on tags (M4
# scope, docs/adr/0008).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege (securability): grant read-only by default; jobs widen only what
# they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: format · lint · type · test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Compatibility: the full supported interpreter range runs on pushes to main
        # and on manual dispatch; pull requests exercise only the canonical version to
        # save Actions minutes, since the merge to main re-runs the full matrix.
        python: ${{ (github.event_name == 'pull_request') && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13"]') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit  # start permissive; flip to `block` with an explicit
                                 # allowlist once a few CI runs show the steady-state
                                 # endpoint set (PyPI, GitHub, Actions runner infra).
          disable-telemetry: true  # Encore's own no-phone-home posture (README §Non-
                                    # goals) applies to its CI, not just its product.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false  # no step here pushes; nothing should keep a token
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (uv sync --frozen — CQ-09)
        run: make install
      - name: Stage 1-2 — format + lint
        run: make lint
      - name: Stage 3 — type (mypy strict)
        run: make type
      - name: Stage 4 — test with coverage (branch >=85%)
        run: make cov
      - name: Stage 8 — responsible-tech guards (read-only Plex · no-secrets-in-logs · no-outing)
        run: make responsible
      - name: SLO schema (OBS-14) + CITATION.cff (DOC-08) + i18n template (I18N G2-lite) checks
        if: matrix.python == '3.12'
        run: |
          make slo-check
          make citation-check
          make i18n-check
      - name: Wheel/sdist build (CQ-10) — the container is not the only artifact
        if: matrix.python == '3.12'
        run: make wheel
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Stage 5 — security (Semgrep · pip-audit · osv-scanner · gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # gitleaks needs full history, not the default shallow clone
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (uv sync --frozen — CQ-09)
        run: make install
      - name: Install gitleaks (pinned, matches .pre-commit-config.yaml)
        run: |
          GL=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
      - name: Install osv-scanner (pinned — second dependency-scan engine, SEC-11/13 B5)
        run: |
          OSV=2.4.0
          curl -sSfL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: SAST + dependency + secret scans (one local/CI/release target)
        # `make security` — the identical target `make verify` composes, run against
        # the frozen-synced env `uv.lock` describes (SEC-11/13), not a separately
        # pip-resolved one. osv-scanner reads `uv.lock` directly (second engine, B5).
        run: make security

  build:
    name: Stage 9 — build (container)
    runs-on: ubuntu-latest
    needs: [gate, security]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Build image (not pushed — proves the Dockerfile builds)
        run: docker build -t encore:ci .
      - name: Container CVE scan (Trivy, SEC-28)
        # Runs on every build, not just at first tagged release — the control's
        # scope is "every Dockerfile repo" and this image builds on every push
        # already. This is what turns the Tier-1 `container_cve_scan` check from a
        # false green (a "Trivy" word in a release.yml TODO comment) into a real one.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "encore:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
      - name: Bring-up check — start the container and probe /livez (QM-08, OBS-19)
        run: |
          docker run -d --name encore-ci -p 8321:8321 encore:ci
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8321/livez; then
              echo; echo "livez OK"; exit 0
            fi
            sleep 0.5
          done
          echo "encore:ci never became ready" >&2
          docker logs encore-ci >&2 || true
          exit 1

  workflow-sast:
    name: workflow SAST (zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
      - name: zizmor .github/workflows/
        run: uvx zizmor .github/workflows/
