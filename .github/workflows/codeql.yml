# CodeQL SAST (SEC-08; CICD-20 adds the `actions` language pack so the workflow
# YAML itself is analyzed, not just Python).
#
# Trigger posture (2026-07-14): scan every main update and weekly even during quiet
# periods. Manual dispatch remains available for incident response and verification.
# Honesty note (2026-07-17): the account-wide Actions budget block (roadmap B1/U6,
# ⛔USER) still prevents jobs from starting; this workflow is configured so the
# control resumes without a code change once billing is restored. No GHAS on this
# private repo, so findings gate in-run instead of uploading SARIF (see analyze job).
name: codeql

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A push to a branch is not a superseded pull-request commit. Keying the group
  # on the ref alone gave every commit on `main` ONE shared slot: GitHub allows
  # one running plus one pending run per group, so a second push cancels the run
  # the first commit was still executing (`cancel-in-progress: true`), and a
  # third push evicts the second from the pending slot (`false`). Either way the
  # commit lands with no verdict at all, and it is reported as `cancelled` or is
  # simply absent -- never as red -- so nothing surfaces it.
  #
  # The discriminator below gives each pushed commit its own slot while leaving
  # pull-request runs grouped per PR, so a superseded PR commit is still
  # cancelled. `cancel-in-progress` is deliberately unchanged.
  group: codeql-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    permissions:
      contents: read
      # CodeQL v4 calls GET /repos/{owner}/{repo}/actions/runs/{run_id}
      # from `analyze`. On a private repo that call is denied without
      # `actions: read` and the step fails with
      # "Resource not accessible by integration".
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
          # No GHAS code scanning on this private repo — findings are checked in-run below.
          upload: never
          output: codeql-results

      - name: Fail on findings (no GHAS on this private repo; SARIF checked in-run)
        shell: bash
        run: |
          count=$(jq -s '[.[] | .runs[]?.results[]?] | length' codeql-results/*.sarif)
          echo "CodeQL findings: ${count}"
          if [ "${count:-0}" -gt 0 ]; then
            jq -r '.runs[]?.results[]? | "\(.ruleId // "rule"): \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)"' codeql-results/*.sarif
            exit 1
          fi
