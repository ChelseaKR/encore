# CodeQL SAST (SEC-08; CICD-20 adds the `actions` language pack so the workflow
# YAML itself is analyzed, not just Python).
#
# Trigger honesty (2026-07-11): manual plus weekly. GitHub Actions jobs are still
# blocked account-wide by the external budget condition (roadmap B1/U6), but the
# schedule remains configured so the control resumes without a code change when
# billing is restored. Push-to-main can return after CI proof-of-life.
name: codeql

on:
  workflow_dispatch: {}
  schedule:
    - cron: '29 3 * * 2' # weekly — re-armed 2026-07-11 (metrics plan Phase 0.2)

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88  # v3.28.19
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88  # v3.28.19
        with:
          category: "/language:${{ matrix.language }}"
          # No GHAS code scanning on this private repo — findings are checked in-run below.
          upload: never
          output: codeql-results

      - name: Fail on findings (no GHAS on this private repo; SARIF checked in-run)
        shell: bash
        run: |
          count=$(jq -s '[.[] | .runs[]?.results[]?] | length' codeql-results/*.sarif)
          echo "CodeQL findings: ${count}"
          if [ "${count:-0}" -gt 0 ]; then
            jq -r '.runs[]?.results[]? | "\(.ruleId // "rule"): \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)"' codeql-results/*.sarif
            exit 1
          fi
