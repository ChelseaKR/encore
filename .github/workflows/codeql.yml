# CodeQL SAST (SEC-08; CICD-20 adds the `actions` language pack so the workflow
# YAML itself is analyzed, not just Python).
#
# Trigger honesty (2026-07-09): currently `workflow_dispatch`-only — GitHub Actions
# billing is broken account-wide (roadmap B1/U6), so scheduled/push runs would only
# accumulate guaranteed failures. When billing is fixed and CI proof-of-life passes,
# restore `push: branches: [main]` + a weekly `schedule:` cron here (the pre-billing
# posture, minus the per-PR run that PR #3 trimmed for Actions-minutes cost).
name: codeql

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88  # v3.28.19
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88  # v3.28.19
        with:
          category: "/language:${{ matrix.language }}"
