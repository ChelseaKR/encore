  "docs/adr/0005-sqlite-single-container.md": 1
  "docs/adr/0006-mbid-matching-with-review-queue.md": 3
  "docs/adr/0008-secrets-at-rest-scheme.md": 1
  "docs/adr/0010-branch-protection-deferred-private-repo.md": 1
  "docs/adr/0012-notification-delivery-and-egress-boundaries.md": 2
  "docs/adr/0013-standing-feeds-capability-urls.md": 1
  "docs/plans/improvement-plan.md": 1
  "src/encore/artistsettings.py": 1
